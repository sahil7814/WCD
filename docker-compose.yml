services:
  postgres:
    image: postgres:16-alpine
    container_name: wcd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wcd_portal
      POSTGRES_USER: wcd_admin
      POSTGRES_PASSWORD: wcd_password
    ports:
      - "5432:5432"
    volumes:
      - wcd_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  wcd_pgdata:
